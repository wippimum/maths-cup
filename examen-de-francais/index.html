<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coupe des Temps</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coupe des Temps">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Night match under the floodlights: one column, a scoreboard header, pitch-green cards.
   Blue = imparfait, red = passé composé, orange = être: the same colours as the class sheet. */
:root{
  --night:#08140F; --turf:#0F2C1F; --turf2:#16402D; --edge:#2A6A4C; --chalk:#EEF7F0; --muted:#9CC2AE;
  --imp:#58AEFF; --imp-bg:rgba(88,174,255,.15); --pc:#FF6157; --pc-bg:rgba(255,97,87,.15);
  --etre:#FFA640; --gold:#FFD447; --good:#3EE08A; --good-bg:rgba(62,224,138,.16); --bad:#FF6157; --near:#FFB547;
  --ink:#08140F;
  --display:"Anton","Impact","Arial Narrow Bold",sans-serif;
  --body:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;color:var(--chalk);font-family:var(--body);font-weight:700;font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(90% 45% at 50% -8%,rgba(255,240,180,.16),transparent 62%),repeating-linear-gradient(90deg,rgba(255,255,255,.022) 0 72px,transparent 72px 144px),var(--night);
  background-color:var(--night);background-attachment:fixed}
#app{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 56px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.02em;text-wrap:balance;margin:0}
b{font-weight:900}

/* header */
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.crest{display:flex;align-items:center;gap:10px;text-align:left;padding:4px 6px 4px 0}
.crest-ball{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--chalk);font-size:28px;box-shadow:0 0 0 3px var(--gold),0 6px 18px rgba(0,0,0,.5)}
.crest b{display:block;font-family:var(--display);font-weight:400;font-size:1.55rem;line-height:1;letter-spacing:.03em;color:var(--gold);text-transform:uppercase}
.crest small{display:block;color:var(--muted);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.icon-btn{width:44px;height:44px;border-radius:12px;background:var(--turf);border:2px solid var(--edge);font-size:1.2rem;display:grid;place-items:center}
.back{color:var(--muted);text-decoration:none;font-size:.85rem;border:2px solid var(--edge);border-radius:10px;padding:6px 10px;white-space:nowrap}

/* generic */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--gold);color:var(--ink);border-radius:14px;padding:13px 20px;font-weight:900;font-size:1.05rem;box-shadow:0 5px 0 #B38B12;transition:transform .08s,box-shadow .08s;text-decoration:none}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #B38B12}
.btn.ghost{background:var(--turf);color:var(--chalk);box-shadow:0 5px 0 #04100A;border:2px solid var(--edge)}
.btn.sm{padding:8px 12px;font-size:.88rem;border-radius:11px}
.btn[disabled]{opacity:.5;cursor:default}
.lead{color:var(--muted);margin:6px 0 16px;max-width:60ch}
.note{color:var(--muted);font-size:.85rem;font-weight:600}
.sec{font-size:1.5rem;color:var(--chalk);margin:22px 0 10px;text-transform:uppercase;letter-spacing:.04em}
.card{background:linear-gradient(180deg,var(--turf2),var(--turf));border:2px solid var(--edge);border-radius:20px;padding:18px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:var(--ink);font-weight:900;padding:12px 18px;border-radius:14px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:calc(100% - 32px);text-align:center}

/* players */
.hero-title{font-size:clamp(2.1rem,7vw,3.2rem);line-height:1;color:var(--chalk);text-transform:uppercase}
.hero-title span{color:var(--gold)}
.jerseys{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.jersey{display:flex;flex-direction:column;gap:8px}
.jersey-main{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 16px 18px;border-radius:22px;background:linear-gradient(160deg,var(--c),color-mix(in srgb,var(--c) 45%,#000));border:3px solid rgba(255,255,255,.25);box-shadow:0 10px 26px rgba(0,0,0,.45);text-align:center}
.j-av{font-size:3.4rem;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.j-name{font-family:var(--display);font-weight:400;font-size:2rem;letter-spacing:.03em;text-transform:uppercase;line-height:1.05;word-break:break-word}
.jersey-main small{opacity:.9}
.jersey-main .btn{margin-top:8px}
.j-edit{color:var(--muted);font-size:.9rem;padding:6px}
.edit-box{margin-top:16px}
.edit-box input{width:100%;font:inherit;font-size:1.2rem;padding:12px 14px;border-radius:12px;border:2px solid var(--edge);background:var(--night);color:var(--chalk)}
.avatars{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.avatars button{width:52px;height:52px;border-radius:14px;background:var(--night);border:2px solid var(--edge);font-size:1.8rem}
.avatars button.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,212,71,.3)}

/* home */
.player-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.avatar{display:grid;place-items:center;width:54px;height:54px;border-radius:16px;background:var(--c);font-size:2rem;flex:none;border:2px solid rgba(255,255,255,.3)}
.pb-txt{min-width:0;flex:1}
.pb-txt b{display:block;font-family:var(--display);font-weight:400;font-size:1.6rem;letter-spacing:.03em;line-height:1.05;text-transform:uppercase;word-break:break-word}
.pb-txt small{color:var(--muted)}
.countdown{margin-top:14px;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--pc-bg);border:2px dashed var(--pc);font-size:.95rem}
.countdown b{font-family:var(--display);font-weight:400;font-size:1.5rem;color:var(--pc);letter-spacing:.03em}
.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;position:relative}
.path::before{content:"";position:absolute;left:27px;top:20px;bottom:20px;border-left:3px dashed rgba(238,247,240,.25)}
.lvl{position:relative;width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px 12px 10px;border-radius:18px;background:linear-gradient(180deg,var(--turf2),var(--turf));border:2px solid var(--edge)}
.lvl-n{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--night);border:3px solid var(--chalk);font-family:var(--display);font-size:1.15rem;z-index:1}
.lvl-ic{font-size:1.7rem;flex:none}
.lvl-txt{min-width:0;flex:1}
.lvl-txt b{display:block;font-size:1.05rem;line-height:1.2}
.lvl-txt small{display:block;color:var(--muted);font-size:.85rem;font-weight:600}
.lvl-st{flex:none;color:var(--gold);letter-spacing:1px;font-size:1.05rem}
.lvl.next{border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,212,71,.2)}
.lvl.next::after{content:"À toi !";position:absolute;top:-10px;right:12px;background:var(--gold);color:var(--ink);font-size:.72rem;font-weight:900;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.06em}
.lvl.exam{background:linear-gradient(180deg,#3A2410,#22160A);border-color:var(--etre)}
.home-foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.board{margin-top:18px}
.board h3{font-size:1.2rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.board-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid rgba(238,247,240,.1);font-variant-numeric:tabular-nums}
.board-row .avatar{width:38px;height:38px;font-size:1.3rem;border-radius:11px}
.board-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board-row .pt{font-family:var(--display);font-size:1.3rem;color:var(--gold)}

/* play */
.play-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ptitle{flex:1;min-width:0}
.ptitle b{display:block;font-family:var(--display);font-weight:400;font-size:1.3rem;letter-spacing:.03em;text-transform:uppercase;line-height:1.1}
.ptitle small{color:var(--muted);font-size:.82rem}
.scoreboard{display:flex;gap:6px;font-variant-numeric:tabular-nums}
.sb{background:#020805;border:2px solid #24443A;border-radius:10px;padding:4px 10px;text-align:center;min-width:58px}
.sb b{display:block;font-family:var(--display);font-weight:400;font-size:1.35rem;color:var(--gold);line-height:1.1}
.sb small{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.quit-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--pc-bg);border:2px solid var(--pc);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.dots{display:flex;gap:5px;margin-bottom:10px}
.dots span{flex:1;height:8px;border-radius:99px;background:rgba(238,247,240,.15)}
.dots span.cur{background:var(--chalk)}
.dots span.w{background:var(--good)} .dots span.d{background:var(--near)} .dots span.l{background:var(--bad)}
.pitch{position:relative;height:66px;border-radius:16px;overflow:hidden;border:2px solid var(--edge);margin-bottom:12px;
  background:repeating-linear-gradient(90deg,#123D2A 0 44px,#17492F 44px 88px)}
.pitch::before{content:"";position:absolute;left:50%;top:-30px;bottom:-30px;border-left:2px solid rgba(255,255,255,.35)}
.pitch::after{content:"";position:absolute;left:calc(50% - 26px);top:7px;width:52px;height:52px;border:2px solid rgba(255,255,255,.35);border-radius:50%}
.goal{position:absolute;right:8px;top:9px;bottom:9px;width:36px;border:3px solid #fff;border-right:0;border-radius:4px 0 0 4px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.28) 0 2px,transparent 2px 7px),repeating-linear-gradient(-45deg,rgba(255,255,255,.28) 0 2px,transparent 2px 7px);z-index:1}
.keeper{position:absolute;left:4px;top:50%;transform:translateY(-50%);font-size:22px}
.ball{position:absolute;left:var(--x,14px);top:50%;transform:translateY(-50%);font-size:26px;z-index:2;transition:left .6s ease}
.pitch.shoot .ball{animation:shoot .55s ease-in forwards}
.pitch.shoot .goal{animation:net .5s .5s}
.pitch.save .keeper{animation:dive .45s forwards}
.pitch.save .ball{animation:blocked .7s ease-out forwards}
@keyframes shoot{to{left:calc(100% - 40px);transform:translateY(-50%) rotate(720deg)}}
@keyframes net{30%{transform:scaleX(1.25)}60%{transform:scaleX(.92)}}
@keyframes dive{to{transform:translate(-18px,-50%) rotate(-35deg) scale(1.3)}}
@keyframes blocked{55%{left:calc(100% - 70px)}100%{left:calc(100% - 150px);transform:translateY(-50%) rotate(-360deg)}}
.qcard{background:linear-gradient(180deg,var(--turf2),var(--turf));border:2px solid var(--edge);border-radius:20px;padding:18px}
.ex-title{display:inline-block;padding:6px 12px;border-radius:8px;font-weight:900;font-size:.95rem;margin-bottom:12px;background:var(--tag,#2E9E4F);color:#fff}
.q-ask{color:var(--muted);font-size:.9rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.q-prompt{font-size:1.35rem;line-height:1.4;margin-bottom:16px}
.q-prompt .big-verb{font-family:var(--display);font-weight:400;font-size:3rem;letter-spacing:.02em;line-height:1;color:var(--chalk);margin:4px 0 6px}
.gap{display:inline-block;min-width:3.5em;border-bottom:3px solid var(--gold);color:var(--gold);text-align:center}
.inf{color:var(--muted);font-style:italic;font-weight:700}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{padding:16px 12px;border-radius:14px;background:var(--night);border:2px solid var(--edge);font-size:1.2rem;font-weight:900;min-height:60px}
.opt:hover{border-color:var(--chalk)}
.opt.right{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--pc-bg);border-color:var(--bad);color:var(--bad)}
.opts.goals .opt{min-height:110px;font-family:var(--display);font-weight:400;font-size:2rem;letter-spacing:.04em;position:relative;border-width:3px;border-style:solid;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 2px,transparent 2px 9px),var(--night)}
.opts.goals .opt.etre{border-color:var(--etre);color:var(--etre)}
.opts.goals .opt.avoir{border-color:var(--pc);color:var(--pc)}
.opts.goals .opt.timp{border-color:var(--imp);color:var(--imp);font-size:1.6rem}
.opts.goals .opt.tpc{border-color:var(--pc);color:var(--pc);font-size:1.6rem}
.opts.reasons{grid-template-columns:1fr}
.opts.reasons .opt{font-size:1.02rem;text-align:left;min-height:52px}
.opts.goals .opt small{display:block;font-family:var(--body);font-size:.8rem;letter-spacing:0;color:var(--muted)}
.opts.goals .opt.right{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.opts.goals .opt.wrong{background:var(--pc-bg)}
.lines{display:flex;flex-direction:column;gap:14px;margin-bottom:14px}
.line{margin:0;font-size:1.18rem;line-height:2.15}
.line .num{display:inline-block;width:1.6em;color:var(--muted)}
.pick{display:inline-flex;gap:4px;padding:2px 4px;border-radius:12px;background:rgba(0,0,0,.25);vertical-align:middle;flex-wrap:wrap;line-height:1.3}
.chip{padding:5px 10px;border-radius:9px;border:2px solid var(--edge);background:var(--night);font-weight:800;font-size:1.02rem}
.chip.on{border-color:var(--gold);background:rgba(255,212,71,.16);color:var(--gold)}
.chip.right{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.chip.wrong{border-color:var(--bad);background:var(--pc-bg);color:var(--bad);text-decoration:line-through}
.typed{display:inline-flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.blank{font:inherit;font-size:1.1rem;font-weight:800;color:var(--chalk);background:var(--night);border:0;border-bottom:3px solid var(--gold);border-radius:8px 8px 0 0;padding:4px 8px;max-width:100%;min-width:5ch}
.blank.right{border-bottom-color:var(--good);color:var(--good);background:var(--good-bg)}
.blank.wrong{border-bottom-color:var(--bad);color:var(--bad);background:var(--pc-bg);text-decoration:line-through}
.blank.near{border-bottom-color:var(--near);background:rgba(255,181,71,.15)}
.fix{color:var(--good);font-weight:900}
.accent-bar{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.accent-bar button{min-width:44px;height:44px;border-radius:10px;background:var(--night);border:2px solid var(--edge);font-size:1.15rem;font-weight:800}
.q-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hint{margin-top:12px;padding:10px 14px;border-radius:12px;background:var(--imp-bg);border:2px solid var(--imp);font-size:.98rem}
.feedback{margin-top:12px;border-radius:20px;padding:16px 18px;border:3px solid var(--good);background:var(--good-bg)}
.feedback.bad{border-color:var(--bad);background:var(--pc-bg)}
.feedback.mid{border-color:var(--near);background:rgba(255,181,71,.13)}
.fb-title{font-family:var(--display);font-weight:400;font-size:2rem;letter-spacing:.03em;line-height:1.05;text-transform:uppercase}
.feedback .fb-title{color:var(--good)} .feedback.bad .fb-title{color:var(--bad)} .feedback.mid .fb-title{color:var(--near)}
.fb-pts{font-family:var(--display);font-weight:400;color:var(--gold);font-size:1.3rem;margin-left:8px}
.fb-list{margin:10px 0 14px;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.fb-list li{background:rgba(0,0,0,.25);border-radius:12px;padding:10px 12px;font-weight:600;line-height:1.45}
.fb-list li b{font-weight:900}
.fb-ans{display:block;margin-bottom:4px;font-weight:800}

/* result */
.result{text-align:center}
.result h2{font-size:clamp(2.2rem,8vw,3.4rem);text-transform:uppercase;color:var(--gold);line-height:1}
.big-stars{font-size:3.4rem;letter-spacing:6px;margin:10px 0}
.big-stars span{display:inline-block;filter:grayscale(1) opacity(.3)}
.big-stars span.on{filter:none;animation:pop .5s backwards}
.big-stars span.on:nth-child(2){animation-delay:.25s} .big-stars span.on:nth-child(3){animation-delay:.5s}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.res-score{font-family:var(--display);font-size:2.6rem;font-variant-numeric:tabular-nums}
.res-sub{color:var(--muted)}
.packs{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:18px 0}
.pack{width:130px;height:170px;perspective:600px}
.pack-in{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.pack.open .pack-in{transform:rotateY(180deg)}
.pack-face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px}
.pack-front{background:linear-gradient(135deg,var(--pc),#7A1E8F 50%,var(--imp));border:3px solid var(--gold);font-family:var(--display);font-size:1.2rem;letter-spacing:.05em;text-transform:uppercase}
.pack-front span{font-size:2.4rem}
.pack-back{transform:rotateY(180deg);background:var(--chalk);color:var(--ink);border:3px solid var(--gold)}
.pack-back .e{font-size:3.4rem;line-height:1}
.pack-back b{font-size:.95rem;line-height:1.15}
.pack-back small{font-size:.72rem;color:#3B5A4A;font-weight:700}
.res-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}

/* album */
.album-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.stk{aspect-ratio:3/4;max-width:100%;border-radius:14px;background:var(--chalk);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;text-align:center;border:3px solid var(--gold);box-shadow:0 6px 14px rgba(0,0,0,.35)}
.stk .e{font-size:2.4rem;line-height:1}
.stk b{font-size:.82rem;line-height:1.1}
.stk small{font-size:.66rem;color:#3B5A4A;font-weight:700;line-height:1.1}
.stk.empty{background:transparent;border:2px dashed rgba(238,247,240,.25);color:var(--muted);box-shadow:none}
.stk.empty .e{opacity:.35}

/* lesson */
.lesson-nav{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.lesson-dots{display:flex;gap:6px;flex:1;justify-content:center}
.lesson-dots span{width:10px;height:10px;border-radius:50%;background:rgba(238,247,240,.2)}
.lesson-dots span.on{background:var(--gold)}
.slide h2{font-size:clamp(1.8rem,6vw,2.4rem);text-transform:uppercase;margin-bottom:8px}
.slide p{margin:8px 0;max-width:62ch}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:12px 0}
.tense{border-radius:16px;padding:14px;border:2px solid}
.tense.i{border-color:var(--imp);background:var(--imp-bg)}
.tense.p{border-color:var(--pc);background:var(--pc-bg)}
.tense h3{font-size:1.5rem;text-transform:uppercase}
.tense.i h3{color:var(--imp)} .tense.p h3{color:var(--pc)}
.tense .role{font-weight:900;font-size:1.05rem}
.tense em{display:block;margin-top:6px;font-weight:800}
.ci{color:var(--imp);font-weight:900} .cp{color:var(--pc);font-weight:900} .ce{color:var(--etre);font-weight:900}
.timeline{width:100%;height:auto;max-width:100%;display:block;margin:8px 0}
.story{font-size:1.25rem;line-height:2.1;background:rgba(0,0,0,.22);border-radius:14px;padding:12px 14px}
.vb{border-bottom:3px dotted var(--gold);padding:0 3px;border-radius:6px;font-weight:900}
.vb.i{background:var(--imp-bg);color:var(--imp);border-bottom:3px solid var(--imp)}
.vb.p{background:var(--pc-bg);color:var(--pc);border-bottom:3px solid var(--pc)}

  function textQs(T) {

      return { kind: 'choice', passage: T, ask: '📖 Compréhension', html: a[0], options: shuffle(opts.map(function (o) { return o.replace(/\*$/, ''); })), correct: right,

    });
    var vf = T.vf.map(function (v) {
      return { kind: 'choice', passage: T, ask: '📖 Vrai ou faux ?', html: '« ' + v[0] + ' »', options: ['VRAI', 'FAUX'], correct: v[1] ? 'VRAI' : 'FAUX', why: function () { return v[2]; } };
    });
    var open = { kind: 'open', passage: T, ask: '✍️ Réponds en français, en une phrase courte', html: T.o[0], kw: T.o[1], model: T.o[2] };

    var find = { kind: 'find', passage: T, tense: T.f, n: n, ask: '🔎 Trouve dans le texte ' + n + ' verbes ' + (isI ? 'à l’imparfait' : 'au passé composé') + '. Touche-les.' };
    var verbs = (T.x.match(isI ? /\[i:([^\]]+)\]/g : /\[p:([^\]]+)\]/g) || []).map(function (m) { return m.slice(3, -1); });

      '<li>🏟️ <span><span class="ci">Imparfait</span> = le décor, ce qui dure, les habitudes. Radical de « nous » + -ais, -ais, -ait, -ions, -iez, -aient.</span></li>' +
      '<li>⚡ <span><span class="cp">Passé composé</span> = l’action terminée, à un moment précis. Auxiliaire au présent + participe passé.</span></li>' +
      '<li>🏠 <span>13 verbes dans la maison d’<span class="ce">être</span>. Tous les autres : <span class="cp">avoir</span>.</span></li>' +
      '<li>➕ <span>Avec être, on accorde : elles sont parti<b>es</b>. Avec avoir, non : elles ont joué.</span></li>' +
      '<li>🔎 <span>Mots-signaux : chaque, souvent, d’habitude → imparfait. Hier, soudain, tout à coup, un jour → passé composé.</span></li></ul>' +
      '<button class="btn" id="lessonDone" type="button">J’ai compris, je file à l’échauffement ▶</button>';
    $('#lessonDone').onclick = function () {
      var p = P(), first = !p.lesson; p.lesson = true; if (first) p.pts += 50;
      var a = award('vestiaire'); save();
      if (a) { toast('Sticker gagné : 📋 Le Vestiaire ! +50 points'); confetti(); sGoal(); }
      startLevel(LEVELS[1]);
    };
  }

  /* ---------------- boot ---------------- */
  $('#crest').onclick = goHome;
  function soundIcon() { $('#soundBtn').textContent = S.sound ? '🔊' : '🔇'; }
  $('#soundBtn').onclick = function () { S.sound = !S.sound; save(); soundIcon(); };
  soundIcon();
  if (/\/examen-de-francais\//.test(location.pathname)) $('#backCup').hidden = false;
  if (S.cur == null) renderPlayers(); else goHome();
})();
</script>
