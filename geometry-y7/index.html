<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geometry Cup</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Geometry Cup">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Night match under the floodlights, the same kit as the French cup.
   Angle colours carry meaning everywhere: gold = given, pink = the one to find,
   blue = corresponding (F), orange = alternate (Z), green = co-interior (C), violet = vertically opposite. */
:root{
  --night:#08140F; --turf:#0F2C1F; --turf2:#16402D; --edge:#2A6A4C; --chalk:#EEF7F0; --muted:#9CC2AE;
  --gold:#FFD447; --x:#FF7AA8; --corr:#58AEFF; --alt:#FFA640; --coint:#3EE08A; --vert:#C79BFF; --line:#FF8F6B;
  --good:#3EE08A; --good-bg:rgba(62,224,138,.16); --bad:#FF6157; --bad-bg:rgba(255,97,87,.14); --near:#FFB547;
  --ink:#08140F; --pt:#8FC8FF;
  --display:"Anton","Impact","Arial Narrow Bold",sans-serif;
  --body:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;color:var(--chalk);font-family:var(--body);font-weight:700;font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(90% 45% at 50% -8%,rgba(255,240,180,.16),transparent 62%),repeating-linear-gradient(90deg,rgba(255,255,255,.022) 0 72px,transparent 72px 144px),var(--night);
  background-color:var(--night);background-attachment:fixed}
#app{max-width:800px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 64px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.02em;text-wrap:balance;margin:0}
b{font-weight:900}
.note{color:var(--muted);font-size:.84rem;font-weight:600}

/* header */
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.crest{display:flex;align-items:center;gap:10px;text-align:left;padding:4px 6px 4px 0}
.crest-ball{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--chalk);font-size:26px;box-shadow:0 0 0 3px var(--gold),0 6px 18px rgba(0,0,0,.5)}
.crest b{display:block;font-family:var(--display);font-weight:400;font-size:1.55rem;line-height:1;letter-spacing:.03em;color:var(--gold);text-transform:uppercase}
.crest small{display:block;color:var(--muted);font-size:.76rem;letter-spacing:.08em;text-transform:uppercase}
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.icon-btn{width:44px;height:44px;border-radius:12px;background:var(--turf);border:2px solid var(--edge);font-size:1.2rem;display:grid;place-items:center}
.back{color:var(--muted);text-decoration:none;font-size:.85rem;border:2px solid var(--edge);border-radius:10px;padding:6px 10px;white-space:nowrap}

/* generic */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--gold);color:var(--ink);border-radius:14px;padding:12px 20px;font-weight:900;font-size:1.04rem;box-shadow:0 5px 0 #B38B12;transition:transform .08s,box-shadow .08s;text-decoration:none;min-height:48px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #B38B12}
.btn.ghost{background:var(--turf);color:var(--chalk);box-shadow:0 5px 0 #04100A;border:2px solid var(--edge)}
.btn.sm{padding:8px 12px;font-size:.88rem;border-radius:11px;min-height:40px}
.btn[disabled]{opacity:.45;cursor:default}
.lead{color:var(--muted);margin:6px 0 16px;max-width:62ch}
.sec{font-size:1.45rem;color:var(--chalk);margin:24px 0 10px;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:baseline;gap:10px}
.sec small{font-family:var(--body);font-size:.8rem;color:var(--muted);letter-spacing:0;text-transform:none;font-weight:700}
.card{background:linear-gradient(180deg,var(--turf2),var(--turf));border:2px solid var(--edge);border-radius:20px;padding:18px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:var(--ink);font-weight:900;padding:12px 18px;border-radius:14px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:calc(100% - 32px);text-align:center}

/* players */
.players{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.player{display:flex;align-items:center;gap:12px;padding:16px;border-radius:18px;background:var(--turf);border:2px solid var(--edge);text-align:left;width:100%}
.player .av{font-size:2rem;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--turf2);border:3px solid var(--gold);flex:none}
.player b{display:block;font-size:1.15rem}
.player small{color:var(--muted);font-size:.84rem}
.rename{margin-top:14px}
.rename input{font:inherit;background:var(--night);color:var(--chalk);border:2px solid var(--edge);border-radius:10px;padding:8px 10px;width:150px}

/* home */
.hero{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hero .who{flex:1;min-width:200px}
.hero .who b{font-size:1.25rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--night);border:2px solid var(--edge);border-radius:999px;padding:4px 12px;font-size:.88rem;white-space:nowrap}
.chip.gold{border-color:var(--gold);color:var(--gold)}
.stations{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.st{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border-radius:16px;background:var(--turf);border:2px solid var(--edge);width:100%;min-height:86px;position:relative}
.st:active{transform:scale(.985)}
.st .ic{font-size:1.7rem;line-height:1;flex:none;width:34px;text-align:center}
.st b{display:block;line-height:1.2}
.st small{display:block;color:var(--muted);font-size:.8rem;margin-top:3px;font-weight:700}
.st .stars{position:absolute;right:10px;top:8px;font-size:.8rem;letter-spacing:1px}
.st.lesson{border-color:var(--gold);background:linear-gradient(135deg,rgba(255,212,71,.13),var(--turf) 60%)}
.st.exam{border-color:#7FB6FF;background:linear-gradient(135deg,rgba(88,174,255,.14),var(--turf) 60%)}
.st .best{display:inline-block;margin-top:6px;font-size:.78rem;color:var(--gold)}

/* play */
.bar{height:10px;background:var(--night);border-radius:99px;overflow:hidden;border:2px solid var(--edge);margin:8px 0 14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--good),var(--gold));width:0;transition:width .3s}
.playhead{display:flex;align-items:center;gap:10px}
.playhead h2{font-size:1.25rem;flex:1;text-transform:uppercase;letter-spacing:.03em}
.qmeta{color:var(--muted);font-size:.82rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;display:flex;gap:10px;justify-content:space-between}
.prompt{font-size:1.07rem;margin-bottom:10px}
.prompt ul.clues{margin:10px 0 0;padding-left:22px}
.prompt ul.clues li{margin:3px 0}
.fig{background:#0B2218;border:2px solid var(--edge);border-radius:16px;padding:6px;margin:10px 0}
.fig:empty{display:none}
.partq{font-weight:900;margin:12px 0 10px;font-size:1.04rem}
.done{display:grid;gap:6px;margin:8px 0}
.done div{font-size:.92rem;padding:7px 11px;border-radius:10px;background:var(--night);border-left:4px solid var(--good)}
.done div.miss{border-left-color:var(--bad)}
.done div.half{border-left-color:var(--near)}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opts.long{grid-template-columns:1fr}
.opts.letters{grid-template-columns:repeat(7,1fr)}
.opt{padding:12px 12px;border-radius:13px;background:var(--turf2);border:2px solid var(--edge);text-align:left;font-weight:800;min-height:50px;line-height:1.3}
.opts.letters .opt{text-align:center;font-size:1.25rem;padding:10px 0}
.opt:active{transform:translateY(2px)}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);opacity:.85}
.opt[disabled]{cursor:default}
.numrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.numrow input{font:inherit;font-size:1.4rem;font-weight:900;width:130px;padding:10px 12px;border-radius:12px;border:2px solid var(--edge);background:var(--night);color:var(--chalk);text-align:center}
.numrow .unit{font-size:1.4rem;font-weight:900}
.tf{display:grid;gap:8px}
.tfrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 10px;background:var(--night);border-radius:12px;border:2px solid transparent}
.tfrow.right{border-color:var(--good)} .tfrow.wrong{border-color:var(--bad)}
.tfrow .why{grid-column:1/-1;font-size:.86rem;color:var(--muted);font-weight:700}
.seg{display:flex;gap:5px}
.seg button{padding:8px 10px;border-radius:10px;background:var(--turf2);border:2px solid var(--edge);font-size:.86rem;font-weight:900;min-width:58px}
.seg button.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.cells .tfrow{grid-template-columns:1fr}
.cells .seg{flex-wrap:wrap}
.cells .seg button{flex:1 1 45%;text-align:left}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.fb{margin-top:12px;padding:12px 14px;border-radius:14px;font-weight:700}
.fb:empty{display:none}
.fb.good{background:var(--good-bg);border:2px solid var(--good)}
.fb.bad{background:var(--bad-bg);border:2px solid var(--bad)}
.fb.info{background:rgba(255,212,71,.1);border:2px solid var(--gold)}
.explain{margin-top:14px;padding:14px;border-radius:14px;background:rgba(88,174,255,.1);border:2px solid #3D6E9E}
.explain h3{font-size:1.05rem;color:var(--corr);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.explain:empty{display:none}
table.mini{border-collapse:collapse;margin:10px 0;font-size:.92rem}
table.mini td,table.mini th{border:1px solid var(--edge);padding:5px 9px;text-align:center}
.gridwrap svg{touch-action:manipulation}
.gridtools{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}

/* results */
.big{font-family:var(--display);font-size:3.2rem;color:var(--gold);line-height:1}
.starrow{font-size:2.2rem;letter-spacing:6px;margin:6px 0}
.mistakes{margin-top:12px;display:grid;gap:8px}
.mistakes div{background:var(--night);border-radius:12px;padding:10px 12px;font-size:.92rem;border-left:4px solid var(--bad)}

/* lesson */
.slide h2{font-size:1.7rem;color:var(--gold);margin-bottom:8px;text-transform:uppercase}
.slide p{margin:8px 0}
.slide .fig{margin:12px 0}
.callout{border-radius:14px;padding:11px 14px;margin:10px 0;background:rgba(255,212,71,.09);border:2px solid rgba(255,212,71,.5)}
.callout.trap{background:var(--bad-bg);border-color:rgba(255,97,87,.6)}
.callout.tip{background:var(--good-bg);border-color:rgba(62,224,138,.6)}
.callout b:first-child{display:block;margin-bottom:2px}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0 4px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--edge)}
.dots i.on{background:var(--gold)}
.lnav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.check{margin-top:14px;padding:14px;border-radius:14px;background:var(--night);border:2px dashed var(--edge)}
.check .partq{margin-top:0}
.cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.scard{background:var(--night);border:2px solid var(--edge);border-radius:14px;padding:10px}
.scard h3{font-size:1.2rem;color:var(--gold);text-transform:uppercase}
.scard ul{margin:6px 0 0;padding-left:18px;font-size:.9rem}
.scard .fig{margin:6px 0;padding:2px}
.toggles{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.toggles button{font-size:.8rem;padding:5px 9px;border-radius:9px;background:var(--turf2);border:2px solid var(--edge);font-weight:800}
.toggles button.on{border-color:var(--gold);color:var(--gold)}
.ptable{width:100%;border-collapse:collapse;font-size:.86rem}
.ptable th,.ptable td{border:1px solid var(--edge);padding:6px 6px;text-align:center}
.ptable th{background:var(--turf2);font-weight:900}
.ptable td:first-child,.ptable th:first-child{text-align:left}
.tablewrap{overflow-x:auto;margin:10px 0;-webkit-overflow-scrolling:touch}
.lab{display:grid;gap:12px;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.labinfo{background:var(--night);border-radius:14px;padding:12px;border:2px solid var(--edge)}
.labinfo .nm{font-family:var(--display);font-size:1.8rem;color:var(--gold);text-transform:uppercase;line-height:1.1}
.labinfo ul{margin:8px 0 0;padding-left:18px;font-size:.9rem}
.labsvg svg{touch-action:none}
.sl{display:flex;align-items:center;gap:10px;margin:8px 0}
.sl input{flex:1;accent-color:var(--gold)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.84rem;margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.reasons{display:grid;gap:6px;margin:10px 0}
.reasons div{padding:8px 12px;background:var(--night);border-radius:10px;border-left:5px solid var(--gold)}
.steptext{min-height:3.5em}
.c-corr{color:var(--corr)} .c-alt{color:var(--alt)} .c-coint{color:var(--coint)} .c-vert{color:var(--vert)} .c-x{color:var(--x)} .c-gold{color:var(--gold)}

/* diagrams */
.dia{width:100%;height:auto;display:block;max-height:330px;overflow:hidden}
.dia.small{max-height:150px}
.dia text{font-family:var(--body);font-weight:900;font-size:15px;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#0B2218;stroke-width:4px;stroke-linejoin:round}
.dia .ln{stroke:var(--chalk);stroke-width:2.6;stroke-linecap:round;fill:none}
.dia .shape{fill:rgba(255,212,71,.09);stroke:var(--chalk);stroke-width:2.6;stroke-linejoin:round}
.dia .shape.thin{stroke-width:1.8}
.dia .shape.ghost{fill:none;stroke:var(--muted);stroke-dasharray:6 6;stroke-width:2}
.dia .shape.tri1{fill:rgba(88,174,255,.18)} .dia .shape.tri2{fill:rgba(255,166,64,.18)}
.dia .chev{stroke:var(--pt);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dia .tick{stroke:var(--gold);stroke-width:2.4;stroke-linecap:round}
.dia .rt{stroke:var(--chalk);fill:none;stroke-width:1.8}
.dia .diag{stroke:var(--muted);stroke-dasharray:5 5;stroke-width:1.8}
.dia .mirror{stroke:var(--gold);stroke-dasharray:8 6;stroke-width:2.6}
.dia .cand{stroke:var(--muted);stroke-dasharray:7 6;stroke-width:2.4;opacity:.75}
.dia .cand.on{stroke:var(--gold);opacity:1;stroke-width:3.4}
.dia .cand.ok{stroke:var(--good);opacity:1;stroke-width:3.4}
.dia .cand.bad{stroke:var(--bad);opacity:1}
.dia .candhit{stroke:transparent;stroke-width:26;cursor:pointer}
.dia .arc{fill:none;stroke-width:2.6}
.dia .wedge{opacity:.3;stroke:none}
.dia .pt{fill:var(--pt);font-size:15px}
.dia .pt.big{font-size:18px}
.dia .note-t{text-anchor:end;font-size:11px;fill:var(--muted);font-weight:700;stroke-width:0}
.dia .hit{fill:transparent;cursor:pointer}
.dia .gdot{fill:#5E8C76}
.dia .gdot.on{fill:var(--gold)}
.dia .gline{stroke:#2D5A44;stroke-width:1}
.dia .handle{fill:var(--gold);stroke:var(--ink);stroke-width:2;cursor:grab}
.dia .tap{fill:transparent;cursor:pointer}
.dia .ov{stroke-width:10;stroke-linecap:round;stroke-linejoin:round;fill:none;opacity:.5}
.dia .ov-F{stroke:var(--corr)} .dia .ov-Z{stroke:var(--alt)} .dia .ov-C{stroke:var(--coint)}
.dia .given{stroke:var(--gold)} .dia text.given{fill:var(--gold)} .dia .wedge.given{fill:var(--gold)}
.dia .unknown{stroke:var(--x)} .dia text.unknown{fill:var(--x)} .dia .wedge.unknown{fill:var(--x)}
.dia .step{stroke:var(--coint)} .dia text.step{fill:var(--coint)} .dia .wedge.step{fill:var(--coint)}
.dia .letter{stroke:#5D88A8} .dia text.letter{fill:#BFE2FF;font-size:16px}
.dia .hl1{stroke:var(--corr)} .dia text.hl1{fill:var(--corr)} .dia .wedge.hl1{fill:var(--corr)}
.dia .hl2{stroke:var(--alt)} .dia text.hl2{fill:var(--alt)} .dia .wedge.hl2{fill:var(--alt)}
.dia .plain{stroke:#5D88A8} .dia text.plain{fill:#CFE6F7;font-size:13px}
.dia .sel{stroke:var(--gold)} .dia text.sel{fill:var(--gold)} .dia .wedge.sel{fill:var(--gold)}
.dia .k-corr{stroke:var(--corr)} .dia text.k-corr{fill:var(--corr)} .dia .wedge.k-corr{fill:var(--corr)}
.dia .k-alt{stroke:var(--alt)} .dia text.k-alt{fill:var(--alt)} .dia .wedge.k-alt{fill:var(--alt)}
.dia .k-coint{stroke:var(--coint)} .dia text.k-coint{fill:var(--coint)} .dia .wedge.k-coint{fill:var(--coint)}
.dia .k-vert{stroke:var(--vert)} .dia text.k-vert{fill:var(--vert)} .dia .wedge.k-vert{fill:var(--vert)}
.dia .k-line{stroke:var(--line)} .dia text.k-line{fill:var(--line)} .dia .wedge.k-line{fill:var(--line)}
.dia .rotg{transition:transform .7s cubic-bezier(.4,1.4,.6,1)}
.dia text.lbl,.dia text.pt{stroke:#0B2218;stroke-width:4px}

@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.pop{animation:pop .35s ease-out}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#fx i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall 1.4s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.6}}
@media (max-width:600px){
  body{font-size:16px}
  .lab{grid-template-columns:1fr}
  .opts.letters{grid-template-columns:repeat(4,1fr)}
  .crest b{font-size:1.3rem}
  .tfrow{grid-template-columns:1fr}
  .stations{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button id="crest" class="crest" type="button" aria-label="Back to the stations">
      <span class="crest-ball">📐</span>
      <span><b>Geometry Cup</b><small>Quadrilaterals · Parallel lines · Y7</small></span>
    </button>
    <div class="top-right">
      <a id="backCup" class="back" href="../index.html">← Maths Cup</a>
      <button id="soundBtn" class="icon-btn" type="button" aria-label="Sound on or off">🔊</button>
    </div>
  </header>
  <section id="scr-players" class="screen"></section>
  <section id="scr-home" class="screen" hidden></section>
  <section id="scr-lesson" class="screen" hidden></section>
  <section id="scr-play" class="screen" hidden></section>
  <section id="scr-result" class="screen" hidden></section>
</div>
<div id="toast" class="toast" hidden></div>
<div id="fx"></div>
<script id="engine">
/* The geometry engine: the drawing kit, the quadrilateral classifier, the parallel-line
   model and every question generator. No DOM in here, so test/test-geometry.js can load
   it in Node, measure every drawn angle and check every answer. */
(function (root) {
'use strict';
var G = {};
var DEG = Math.PI / 180;
var rand = Math.random;
G.seed = function (s) {
  var a = s >>> 0;
  rand = function () { a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
};
G.unseed = function () { rand = Math.random; };
function ri(a, b) { return a + Math.floor(rand() * (b - a + 1)); }
function pick(a) { return a[Math.floor(rand() * a.length)]; }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rand() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

/* ------------------------------------------------------------------ vectors */

      $('#spback').disabled = i === 0; $('#spnext').disabled = i === steps.length - 1;
    };

  }

  /* --- small hand-built diagrams for the slides --- */
  function factsSVG(which) {
    var K = new G.Kit(220, 150, which);
    if (which === 'line') {
      var O = [110, 110]; K.line([20, 110], [200, 110]); K.line(O, [110 - 90 * Math.cos(50 * Math.PI / 180), 110 - 90 * Math.sin(50 * Math.PI / 180)]);
      K.arc(O, 0, 130, { label: '130°', kind: 'given' }); K.arc(O, 130, 50, { label: '50°', kind: 'unknown' });
    } else if (which === 'point') {
      var C = [110, 78], ds = [20, 140, 250];
      ds.forEach(function (d) { K.line(C, [C[0] + 70 * Math.cos(d * Math.PI / 180), C[1] - 70 * Math.sin(d * Math.PI / 180)]); });
      K.arc(C, 20, 120, { label: '120°' }); K.arc(C, 140, 110, { label: '110°', kind: 'hl1' }); K.arc(C, 250, 130, { label: '130°', kind: 'unknown' });
    } else if (which === 'vert') {
      var X = [110, 75];
      K.line([20, 30], [200, 120]); K.line([30, 135], [190, 15]);
      var a1 = Math.atan2(45, 90) * 180 / Math.PI, a2 = Math.atan2(60, 80) * 180 / Math.PI;
      K.arc(X, a2, 180 - a2 - a1, { label: '110°', kind: 'given' }); K.arc(X, 180 + a2, 180 - a2 - a1, { label: '110°', kind: 'given' });
      K.arc(X, -a1, a1 + a2, { label: '70°', kind: 'hl1' }); K.arc(X, 180 - a1, a1 + a2, { label: '70°', kind: 'hl1' });
    } else {
      var A = [30, 130], B = [195, 130], Cc = [90, 25];
      K.poly([A, B, Cc], 'shape');
      K.angle(A, B, Cc, { label: '60°' }); K.angle(B, A, Cc, { label: '35°', kind: 'hl1' }); K.angle(Cc, A, B, { label: '85°', kind: 'unknown' });
    }
    return K.svg('small');
  }
  function quad360SVG() {
    var P0 = [[40, 170], [250, 190], [290, 50], [110, 30]];
    var K = new G.Kit(330, 220, 'A quadrilateral split into two triangles');
    K.poly([P0[0], P0[1], P0[2]], 'shape tri1'); K.poly([P0[0], P0[2], P0[3]], 'shape tri2');
    K.line(P0[0], P0[2], 'diag');
    K.text([190, 150], '180°', 'lbl hl1'); K.text([150, 80], '180°', 'lbl hl2');
    return K.svg();
  }
  function marksSVG() {
    var pg = [[30, 150], [90, 40], [250, 40], [190, 150]];
    var a = G.quadSVG(pg, { w: 280, h: 190, marks: 'all' }).svg;
    var rc = [[50, 40], [230, 40], [230, 150], [50, 150]];
    var b = G.quadSVG(rc, { w: 280, h: 190, marks: 'right' }).svg;
    return '<div class="cards"><div class="scard"><h3>Ticks and arrows</h3><div class="fig">' + a + '</div><p class="note">One tick pairs with one tick, two with two. One arrow pairs with one arrow, two with two.</p></div><div class="scard"><h3>Right angles</h3><div class="fig">' + b + '</div><p class="note">The little square in a corner means exactly 90°.</p></div></div>';
  }
  function cdefSVG() {
    var sp = 30, m = 16, at = function (c) { return [m + c[0] * sp, m + c[1] * sp]; };
    var K = new G.Kit(m * 2 + 8 * sp, m * 2 + 7 * sp, 'The finished CDEF');
    for (var c = 0; c < 9; c++) K.line(at([c, 0]), at([c, 7]), 'gline');
    for (var r = 0; r < 8; r++) K.line(at([0, r]), at([8, r]), 'gline');
    K.poly([at([1, 1]), at([1, 5]), at([3, 5]), at([6, 1])]);
    K.right(at([1, 5]), at([1, 1]), at([3, 5]));
    K.text(G.v.add(at([1, 1]), [-12, -10]), 'C', 'pt big'); K.text(G.v.add(at([1, 5]), [-12, 12]), 'D', 'pt big');
    K.text(G.v.add(at([3, 5]), [8, 14]), 'E', 'pt big'); K.text(G.v.add(at([6, 1]), [10, -10]), 'F', 'pt big');
    return K.svg();
  }
  function familyTree() {
    var box = function (t, sub, cls) { return '<div class="scard" style="text-align:center;padding:8px' + (cls ? ';border-color:' + cls : '') + '"><b>' + t + '</b>' + (sub ? '<div class="note">' + sub + '</div>' : '') + '</div>'; };
    return '<div style="display:grid;gap:8px">' + box('Quadrilateral', 'any 4 straight sides') +
      '<div class="cards" style="grid-template-columns:repeat(3,1fr)">' + box('Trapezium', 'exactly 1 pair parallel') + box('Parallelogram', '2 pairs parallel', 'var(--corr)') + box('Kite', '2 pairs of adjacent sides equal', 'var(--alt)') + '</div>' +
      '<div class="cards" style="grid-template-columns:repeat(2,1fr)">' + box('Rectangle', 'a parallelogram with right angles', 'var(--corr)') + box('Rhombus', 'a parallelogram with equal sides (also a special kite)', 'var(--alt)') + '</div>' +
      box('Square', 'a rectangle AND a rhombus: the most special of all', 'var(--gold)') + '</div>';
  }
  function propTable() {
    var rows = ['square', 'rectangle', 'rhombus', 'parallelogram', 'kite', 'trapezium'];
    return '<div class="tablewrap"><table class="ptable"><tr><th>Shape</th><th>Pairs of parallel sides</th><th>Lines of symmetry</th><th>Rotation order</th><th>Diagonals equal?</th><th>Diagonals cross at 90°?</th></tr>' +
      rows.map(function (r) { var p = G.PROPS[r]; return '<tr><td><b>' + cap(r) + '</b></td><td>' + p.par + '</td><td>' + p.lines + '</td><td>' + p.rot + '</td><td>' + p.diagEq + '</td><td>' + p.diagPerp + '</td></tr>'; }).join('') + '</table></div>';
  }
  var REASONS_HTML = '<div class="reasons">' + ['corr', 'alt', 'coint', 'vert', 'line', 'point', 'tri', 'iso', 'quad'].map(function (k) { return '<div>' + G.RS[k] + '</div>'; }).join('') + '</div>';

  /* worked example steppers built from the same drawing engine as the questions */
  function q4Steps() {
    var base = function (labels, ov) { return G.parallel({ trans: [{ theta: 121, labels: labels, ends: ['A', ''], pts: ['B', 'C'] }], names: ['K', 'L', 'M', 'N'], overlay: ov }).svg; };
    return [
      { svg: base({ '0TR': { t: 'x', kind: 'unknown' }, '1TL': '59°' }), t: 'KL is parallel to MN. x and 59° are <b>not</b> a simple pair: they are at different crossings AND on different sides. So we need a stepping-stone angle.' },
      { svg: base({ '0TR': { t: 'x', kind: 'unknown' }, '1TL': '59°', '1TR': { t: '121°', kind: 'step', wedge: true } }), t: '∠BCN sits next to the 59° on the straight line MN. 180 − 59 = <b>121°</b>. Reason: <i>angles on a straight line add up to 180°</i>.' },
      { svg: base({ '0TR': { t: '121°', kind: 'unknown', wedge: true }, '1TL': '59°', '1TR': { t: '121°', kind: 'step', wedge: true } }, { kind: 'F', a: '0TR', b: '1TR' }), t: '∠BCN and x are in the same position at each crossing: an F. So <b>x = 121°</b>. Reason: <i>corresponding angles are equal</i>. Two steps, two reasons: full marks.' }
    ];
  }
  function q13Steps() {
    var pts = { C: [135, 267], E: [685, 267], D: [333, 267], F: [130, 425], I: [690, 425], G: [265, 425], H: [430, 425] };
    var mk = function (angles) {
      return G.free({ pts: pts, lines: [['C', 'E'], ['F', 'I'], ['D', 'G'], ['D', 'H']], arrows: [['C', 'E', 1, 0.86], ['F', 'I', 1, 0.86]], angles: angles,
        labels: { C: [-1, 0], E: [1, 0], F: [-1, 0], I: [1, 0], D: [0, -1], G: [0, 1], H: [0, 1] }, h: 220 }).svg;
    };
    var g1 = { at: 'D', from: 'E', to: 'H', t: '50°' }, g2 = { at: 'G', from: 'F', to: 'D', t: '100°' };
    var s1 = { at: 'G', from: 'H', to: 'D', t: '80°', kind: 'step' }, s2 = { at: 'H', from: 'G', to: 'D', t: '50°', kind: 'step' }, s3 = { at: 'D', from: 'G', to: 'H', t: '50°', kind: 'unknown' };
    return [
      { svg: mk([g1, g2]), t: 'CE ∥ FI. ∠EDH = 50°, ∠DGF = 100°. To show DGH is isosceles we must find <b>two equal angles</b> inside the triangle.' },
      { svg: mk([g1, g2, s1]), t: '∠DGH = 180 − 100 = <b>80°</b>. Reason: <i>angles on a straight line add up to 180°</i>.' },
      { svg: mk([g1, g2, s1, s2]), t: '∠DHG = <b>50°</b>. It makes a Z with ∠EDH. Reason: <i>alternate angles are equal</i>.' },
      { svg: mk([g1, g2, s1, s2, s3]), t: '∠GDH = 180 − 80 − 50 = <b>50°</b>. Reason: <i>angles in a triangle add up to 180°</i>. Two angles are 50°, so triangle DGH is <b>isosceles</b>. ✔' }
    ];
  }

  var LESSONS = {};
  LESSONS.quad = function () {
    return [
      { t: 'What is a quadrilateral?', h: '<p>A <b>quadrilateral</b> is any flat shape with <b>four straight sides</b>. <i>Quad</i> means four (a quad bike has four wheels) and <i>lateral</i> means sides.</p><p>It has four corners, called <b>vertices</b> (one corner is a <b>vertex</b>), and four angles inside it.</p><div class="fig">' + quad360SVG() + '</div><p>Draw a line from one corner to the opposite corner (a <b>diagonal</b>). The shape splits into <b>two triangles</b>. Each triangle’s angles add up to 180°, so:</p><div class="callout tip"><b>Rule</b>The four angles of ANY quadrilateral add up to 2 × 180° = <b>360°</b>.</div>',
        q: { q: 'A quadrilateral has angles 90°, 90° and 100°. What is the fourth angle?', o: ['80°', '100°', '180°', '260°'], a: 0, ok: '90 + 90 + 100 = 280, and 360 − 280 = 80°.', w: { 1: 'Add the three: 280. Then 360 − 280.', 2: '180 is for triangles. Quadrilaterals use 360.', 3: 'That is 360 − 100. Take away all three angles.' } } },
      { t: 'Reading the marks: the secret code', h: '<p>Exam diagrams use three marks. Learn them and the shape tells you its own name.</p>' + marksSVG() + '<ul><li><b>Ticks</b> (little dashes across sides): those sides are the <b>same length</b>.</li><li><b>Arrows</b> on sides: those sides are <b>parallel</b>. They point the same way and never meet, like train tracks.</li><li><b>A little square</b> in a corner: a <b>right angle</b>, exactly 90°.</li></ul><div class="callout trap"><b>Trap</b>Many diagrams say <i>“not drawn accurately”</i>. Don’t measure and don’t trust your eyes. Trust the marks.</div>',
        q: { q: 'Two sides of a shape both have double arrows (>>). What does that tell you?', o: ['They are parallel to each other', 'They are the same length', 'They meet at a right angle', 'They are twice as long'], a: 0, ok: 'Arrows mean parallel. Double arrows pair with double arrows.', w: { 1: 'Equal length is shown with ticks, not arrows.', 2: 'A right angle is shown with a little square.', 3: 'The number of arrows just tells you WHICH pair goes together.' } } },
      { t: 'Two kinds of symmetry', h: '<p><b>Line symmetry</b> (reflection): a <b>mirror line</b> splits the shape into two halves that match exactly. If you folded the paper along the line, the halves would land on top of each other.</p><p><b>Rotational symmetry</b>: trace the shape and spin the tracing around its centre. The <b>order</b> is how many times it fits its outline in one full turn. The start counts, so every shape has order at least 1.</p><div class="rotdemo"></div><div class="callout trap"><b>Trap</b>A diagonal is NOT always a mirror line. Fold a rectangle from corner to corner: the halves don’t match. A rectangle has only 2 lines of symmetry.</div>',
        init: rotDemo, q: { q: 'What is the order of rotational symmetry of a rectangle?', o: ['1', '2', '4'], a: 1, ok: 'It fits after a half turn and again after the full turn: order 2.', w: { 0: 'Try the rectangle above: it fits after a half turn too.', 2: 'A quarter turn makes it stand up tall, so it doesn’t fit. Only a square has order 4.' } } },
      { t: 'The parallelogram family', h: '<p>Start with a <b>parallelogram</b>: two pairs of parallel sides. Then make it more special:</p><ul><li>Make all the angles 90° → <b>rectangle</b>.</li><li>Make all the sides equal → <b>rhombus</b> (a pushed-over square, like a diamond).</li><li>Do both → <b>square</b>.</li></ul><p>Tap the buttons on each card to see its mirror lines and diagonals.</p><div class="cards">' +
          shapeCard('parallelogram', 'Parallelogram', ['2 pairs of parallel sides', 'Opposite sides equal, opposite angles equal', '<b>0</b> lines of symmetry, rotation order <b>2</b>', 'Diagonals cut each other in half']) +
          shapeCard('rectangle', 'Rectangle', ['4 right angles', 'Opposite sides equal and parallel', '<b>2</b> lines of symmetry, rotation order <b>2</b>', 'Diagonals are equal']) +
          shapeCard('rhombus', 'Rhombus', ['4 equal sides', 'Opposite angles equal, no right angles', '<b>2</b> lines of symmetry (its diagonals), order <b>2</b>', 'Diagonals cross at 90°, but are different lengths']) +
          shapeCard('square', 'Square', ['4 equal sides and 4 right angles', '<b>4</b> lines of symmetry, rotation order <b>4</b>', 'Diagonals equal AND cross at 90°']) + '</div>',
        init: initCards, q: { q: 'Which shape has two pairs of parallel sides but NO lines of symmetry?', o: ['Parallelogram', 'Rectangle', 'Rhombus', 'Square'], a: 0, ok: 'Fold a parallelogram any way you like: the halves never match.', w: { 1: 'A rectangle has 2 lines of symmetry.', 2: 'A rhombus has 2: its diagonals.', 3: 'A square has 4.' } } },
      { t: 'Kite, arrowhead and trapezium', h: '<div class="cards">' +
          shapeCard('kite', 'Kite', ['2 pairs of equal sides <b>next to each other</b>', 'No parallel sides', '<b>1</b> line of symmetry, order <b>1</b>', 'Diagonals cross at 90°; one pair of equal angles']) +
          shapeCard('arrowhead', 'Arrowhead (delta)', ['A kite pushed in: it has a dent', 'One angle is <b>reflex</b> (more than 180°)', '<b>1</b> line of symmetry, order <b>1</b>']) +
          shapeCard('trapezium', 'Trapezium', ['Exactly <b>1</b> pair of parallel sides', 'Usually 0 lines of symmetry, order 1']) +
          shapeCard('isotrap', 'Isosceles trapezium', ['1 pair of parallel sides', 'The slanted sides are equal', '<b>1</b> line of symmetry; diagonals equal']) +
          shapeCard('righttrap', 'Right-angled trapezium', ['1 pair of parallel sides', '<b>2</b> right angles', 'Question 3 on your sheet is one of these']) + '</div><div class="callout trap"><b>Trap (sheet Q3)</b>Two right angles and a slanted side? Count the parallel pairs. One pair means <b>trapezium</b>, even with right angles.</div>',
        init: initCards, q: { q: 'A shape has exactly one pair of parallel sides. What is it?', o: ['Trapezium', 'Parallelogram', 'Kite', 'Rhombus'], a: 0, ok: 'One pair of parallel sides: trapezium.', w: { 1: 'A parallelogram has TWO pairs.', 2: 'A kite has none.', 3: 'A rhombus has two pairs.' } } },
      { t: 'The big table (sheet Q10)', h: '<p>Everything in one place. Notice the pattern: the more special the shape, the more symmetry it has.</p>' + propTable() + '<div class="callout tip"><b>Memory trick</b>Diagonals cross at 90° in the shapes with <b>all sides equal</b> (rhombus, square) and in the <b>kite</b>. Diagonals are equal in the shapes with <b>right angles</b> (rectangle, square).</div>',
        q: { q: 'Which shape has diagonals that are always equal but do NOT cross at 90°?', o: ['Rectangle', 'Rhombus', 'Kite', 'Square'], a: 0, ok: 'Rectangle: equal diagonals, crossing at a slant.', w: { 1: 'A rhombus’s diagonals cross at 90° and are NOT equal: the opposite.', 2: 'A kite’s diagonals cross at 90°.', 3: 'A square’s diagonals are equal AND cross at 90°.' } } },
      { t: 'Always, sometimes, never', h: familyTree() + '<p style="margin-top:12px">Read the tree downwards: every shape is a special version of the one above it. So <b>every square is a rectangle</b>, but <b>not every rectangle is a square</b>.</p><div class="callout"><b>“May be true” (sheet Q13)</b>Maisie draws a trapezium. Does it have a line of symmetry? We don’t know which trapezium she drew: an isosceles one does, others don’t. So the answer is <b>may be true</b>.</div><div class="callout tip"><b>One example is enough (sheet Q12)</b>James says “two pairs of equal sides means rectangle or parallelogram.” To prove him wrong you only need one <b>counter-example</b>: a <b>kite</b> has two pairs of equal sides and is neither.</div>',
        q: { q: 'True, may be true, or false: “a parallelogram is a rectangle”.', o: ['True', 'May be true', 'False'], a: 1, ok: 'Some parallelograms have right angles (those are rectangles); most don’t.', w: { 0: 'A slanted parallelogram has no right angles, so it is not a rectangle.', 2: 'A rectangle IS a special parallelogram, so some parallelograms are rectangles.' } } },
      { t: 'The shape lab', h: '<p>Drag the yellow corners. The lab names your shape live, draws its marks and its mirror lines, and works out its symmetry.</p><div class="labwrap"></div><div class="callout tip"><b>Challenges</b>Make a kite with a right angle. Make a trapezium with a line of symmetry. Turn the square into a rhombus by moving just two corners. Can you make a shape with exactly 3 lines of symmetry? (You can’t! Why not?)</div>', init: shapeLab },
      { t: 'Drawing on a dotty grid', h: '<p>For each side, count the steps <b>across</b> and <b>up</b> from one corner to the next.</p><ul><li><b>Parallel sides</b> use the same steps: 3 across and 1 up is parallel to another 3 across and 1 up.</li><li><b>Equal slanted sides</b> use the same numbers (2 across, 1 up is the same length as 1 across, 2 up).</li><li><b>Kite</b>: draw an imaginary vertical mirror line and put matching corners either side of it.</li><li>Tap the corners <b>in order round the shape</b>, or the sides will cross.</li></ul><p><b>Sheet Q14, worked:</b> CD = 4 cm, so DE = 2 cm, at 90° to CD. CF ∥ DE, so CF is flat too, and 5 cm long. Join E to F.</p><div class="fig">' + cdefSVG() + '</div>',
        q: { q: 'One side goes 3 across and 1 up. Which side would be parallel to it?', o: ['3 across, 1 up', '1 across, 3 up', '3 across, 1 down', '3 across, 3 up'], a: 0, ok: 'Same steps, same direction: parallel.', w: { 1: 'Swapping the numbers gives a different slope (that one is actually at 90° if you go 1 back, 3 up!).', 2: 'Going down instead of up changes the direction.', 3: 'A different slope: steeper.' } } }
    ];
  };
  LESSONS.parallel = function () {
    return [
      { t: 'Four facts you already know', h: '<div class="cards"><div class="scard"><h3>Straight line</h3><div class="fig">' + factsSVG('line') + '</div><p class="note">Angles on a straight line add up to <b>180°</b>.</p></div><div class="scard"><h3>Around a point</h3><div class="fig">' + factsSVG('point') + '</div><p class="note">Angles around a point add up to <b>360°</b>.</p></div><div class="scard"><h3>Vertically opposite</h3><div class="fig">' + factsSVG('vert') + '</div><p class="note">Where two lines cross (an X), opposite angles are <b>equal</b>.</p></div><div class="scard"><h3>Triangle</h3><div class="fig">' + factsSVG('tri') + '</div><p class="note">Angles in a triangle add up to <b>180°</b>.</p></div></div><p>Every parallel-lines question uses these four facts as well as the three new ones. Keep them in your pocket.</p>',
        q: { q: 'Two angles sit on a straight line. One is 65°. What is the other?', o: ['115°', '25°', '65°', '295°'], a: 0, ok: '180 − 65 = 115°.', w: { 1: '25 is 90 − 65. A straight line is 180.', 2: 'They are not equal unless both are 90°.', 3: 'That is 360 − 65. A straight line is 180.' } } },
      { t: 'Parallel lines and the transversal', h: '<p><b>Parallel lines</b> go in exactly the same direction and never meet, however far they go. We mark them with matching <b>arrows</b>. A line that crosses them is called a <b>transversal</b>.</p><p>The transversal makes <b>eight angles</b>, four at each crossing. Slide the tilt and watch:</p><div class="explorer"></div><div class="callout tip"><b>The big secret</b>All eight angles come in just <b>two sizes</b>: a small one and a big one, and small + big = 180°. Every rule in this lesson is just a way of saying which is which.</div>',
        init: function (r) { explorer(r, { simple: true }); }, q: { q: 'One of the eight angles is 70°. What size are the others?', o: ['70° or 110°', 'All 70°', '70° or 20°', '70° or 290°'], a: 0, ok: 'The small ones are 70°, the big ones 180 − 70 = 110°.', w: { 1: 'Only when the transversal is at 90° are they all the same.', 2: '20 would be 90 − 70. The pairs make 180.', 3: '290 is 360 − 70; no angle here is bigger than 180°.' } } },
      { t: 'Corresponding angles: look for an F', h: '<p>Corresponding angles are in the <b>same position</b> at each crossing: both above-right, or both below-left, and so on. Slide one crossing along the transversal and it lands exactly on the other.</p><div class="cycler"></div><div class="callout tip"><b>Rule</b><span class="c-corr">Corresponding angles are equal.</span> The F can be backwards, upside down or squashed: it is still an F.</div>',
        init: function (r) { pairCycler(r, 'F', 'corresponding'); }, q: { q: 'Corresponding angles are…', o: ['equal', 'add up to 180°', 'add up to 360°'], a: 0, ok: 'Equal: same position, same size.', w: { 1: 'That is co-interior angles (the C).', 2: '360 is for angles around a point.' } } },
      { t: 'Alternate angles: look for a Z', h: '<p>Alternate angles are <b>inside</b> the parallel lines (between them), on <b>opposite sides</b> of the transversal. They sit in the corners of a <b>Z</b>.</p><div class="cycler"></div><div class="callout tip"><b>Rule</b><span class="c-alt">Alternate angles are equal.</span> The Z can be backwards (like an S or N). Look for the two corners tucked inside the Z.</div>',
        init: function (r) { pairCycler(r, 'Z', 'alternate'); }, q: { q: 'Where are alternate angles?', o: ['Between the parallel lines, on opposite sides of the transversal', 'Between the parallel lines, on the same side of the transversal', 'In the same position at each crossing', 'Opposite each other at one crossing'], a: 0, ok: 'Inside, opposite sides: the corners of a Z.', w: { 1: 'Same side is co-interior (the C).', 2: 'Same position is corresponding (the F).', 3: 'That is vertically opposite (the X).' } } },
      { t: 'Co-interior angles: look for a C', h: '<p>Co-interior angles are <b>inside</b> the parallel lines, on the <b>same side</b> of the transversal. They sit inside a <b>C</b> (or a U).</p><div class="cycler"></div><div class="callout tip"><b>Rule</b><span class="c-coint">Co-interior angles add up to 180°.</span></div><div class="callout trap"><b>Trap</b>Co-interior angles are NOT equal (unless both are 90°). One is small, one is big. If you copy the number across, you lose the mark.</div>',
        init: function (r) { pairCycler(r, 'C', 'cointerior'); }, q: { q: 'Two co-interior angles: one is 72°. The other is…', o: ['108°', '72°', '18°', '288°'], a: 0, ok: '180 − 72 = 108°.', w: { 1: 'Co-interior angles are not equal: they add up to 180°.', 2: '18 is 90 − 72.', 3: '288 is 360 − 72.' } } },
      { t: 'The angle explorer', h: '<p>Tap any angle. Its whole family lights up in the colours of the rules. Then tilt the transversal: the family stays the same, only the numbers change.</p><div class="explorer"></div><div class="callout"><b>Try this</b>Tap an angle <b>outside</b> the parallel lines. Why does it have no alternate or co-interior partner?</div>', init: function (r) { explorer(r, { sel: '0BL' }); } },
      { t: 'Reasons the examiner accepts', h: '<p>“Give a reason” is worth a mark of its own. Write the <b>whole sentence</b>, exactly like these:</p>' + REASONS_HTML + '<div class="callout trap"><b>No marks for</b>“Z angles”, “F angles”, “they look the same”, “because of the parallel lines”. Use the proper name.</div><div class="callout tip"><b>Naming an angle</b>∠ABC means the angle at <b>B</b> (the middle letter), between BA and BC. One reason for every step.</div>',
        q: { q: 'Which reason gets the mark?', o: ['Alternate angles are equal', 'Z angles', 'They look the same', 'Because the lines are parallel'], a: 0, ok: 'The full rule, with its proper name.', w: { 1: '“Z angles” is a memory trick, not a reason. Write “alternate angles are equal”.', 2: 'Diagrams are not accurate, so looks don’t count.', 3: 'Which rule? You must name it.' } } },
      { t: 'Two steps: the stepping stone (sheet Q4)', h: '<p>When the two angles are not a simple pair, find an angle in between that links to both.</p><div class="stepper"></div>', init: function (r) { stepper(r, q4Steps()); } },
      { t: 'Triangles inside parallel lines (sheet Q13)', h: '<p>Many exam questions hide a triangle between the parallel lines. Fill in every angle you can, one rule at a time, until you reach the one you want.</p><div class="stepper"></div><div class="callout tip"><b>The habit</b>Write each angle ON the diagram as soon as you find it. The next step usually jumps out.</div>', init: function (r) { stepper(r, q13Steps()); } },
      { t: 'Working backwards, and algebra (Q9, Q16)', h: '<p><b>Are the lines parallel?</b> The rules work backwards too. If co-interior angles add up to <b>exactly</b> 180°, or corresponding or alternate angles are equal, the lines ARE parallel. If not, they aren’t, however parallel they look.</p><p>Sheet Q9: 83° + 97° = 180°, so CD and EF <b>are</b> parallel. Nigel is right.</p><p><b>Algebra (Q16)</b>: angles 7x − 40 and 5x + 10. First decide: <b>equal</b> or <b>add to 180</b>? Here they are equal, so</p><div class="callout">7x − 40 = 5x + 10 → 2x − 40 = 10 → 2x = 50 → <b>x = 25</b>. Check: 7 × 25 − 40 = 135 and 5 × 25 + 10 = 135 ✓</div>',
        q: { q: 'Two co-interior angles are 3x and 2x + 30. Which equation is right?', o: ['3x + 2x + 30 = 180', '3x = 2x + 30', '3x + 2x + 30 = 360'], a: 0, ok: 'Co-interior angles add up to 180°. Then 5x = 150, so x = 30.', w: { 1: 'That says they are equal. Co-interior angles add up to 180°.', 2: '360 is around a point.' } } }
    ];
  };

  /* test hook: lets the browser test read the current question (no effect on play) */
  window.__geo = { game: function () { return game; }, render: function () { game.q = game.qs ? game.qs[game.qi] : game.q; game.pi = 0; renderQ(); } };

  /* ---------------- boot ---------------- */
  $('#crest').onclick = function () { if (S.cur == null) renderPlayers(); else if (!game || $('#scr-play').hidden || confirm('Leave this round?')) { game = null; renderHome(); } };
  var sb = $('#soundBtn');
  sb.textContent = S.sound ? '🔊' : '🔇';
  sb.onclick = function () { S.sound = !S.sound; save(); sb.textContent = S.sound ? '🔊' : '🔇'; };
  if (S.cur == null) renderPlayers(); else renderHome();
})();
</script>
